image: registry.git.fh-aachen.de/docker-images/gcc-arm-none-eabi-image:14.2.rel1-alpine

stages:
  - examples
  - pages

variables:
  GIT_SUBMODULE_STRATEGY: recursive

.common:
  stage: examples
  before_script:
    - cd examples/$EXAMLE_FOLDER
  script:
    - cmake -S . -B build
    - cmake --build build -j4
  tags:
    - shared

msp432_examples:
  extends: .common
  variables:
    EXAMLE_FOLDER: "msp432-launchpad"
  only:
    changes:
      - .gitlab-ci.yml
      - cmake/**/*
      - include/**/*
      - lib/**/*
      - src/**/*
      - tools/**/*
      - examples/msp432-launchpad/**/*

rp2040_examples:
  extends: .common
  variables:
    EXAMLE_FOLDER: "rp2040-launchpad"
  only:
    changes:
      - .gitlab-ci.yml
      - cmake/**/*
      - include/**/*
      - lib/**/*
      - src/**/*
      - tools/**/*
      - examples/rp2040-launchpad/**/*

rp2350_examples:
  extends: .common
  variables:
    EXAMLE_FOLDER: "rp2350-launchpad"
  only:
    changes:
      - .gitlab-ci.yml
      - cmake/**/*
      - include/**/*
      - lib/**/*
      - src/**/*
      - tools/**/*
      - examples/rp2350-launchpad/**/*

pages:
  image: alpine:3.21.2
  stage: pages
  needs: []
  script:
    - apk --no-cache add doxygen graphviz ttf-freefont
    - cd doc && doxygen Doxyfile
    - mv documentation/html/ ../public/
  artifacts:
    paths:
      - public
  only:
    refs:
      - master
    changes:
      - .gitlab-ci.yml
      - README.md
      - doc/**/*
      - include/**/*
      - src/**/*
  tags:
    - shared

